##
## tinyproxy.conf -- container tuned configuration
##
## Directives that matter for monitoring are annotated; everything else is kept
## close to the upstream defaults (see etc/tinyproxy.conf.in).
##

#
# Drop privileges after binding. tinyproxy starts as root, binds the port and
# then switches to this user/group.
#
User tinyproxy
Group tinyproxy

#
# Port / Listen: the proxy endpoint exposed as 8888.
#
Port 8888
Listen 0.0.0.0

#
# Timeout: maximum inactivity in seconds before a connection is closed.
#
Timeout 600

#
# Maximum number of simultaneously serviced clients (threads).
# When this limit is hit tinyproxy logs
# "Maximum number of connections reached. Refusing new connections." and
# increments its internal "refused" counter.
#
MaxClients 100

##
## Monitoring: StatHost + StatFile
##
## A request whose Host header equals StatHost is answered by tinyproxy itself
## instead of being forwarded. The exporter performs
##   GET http://tinyproxy.stats/  (through the proxy)
## to read the run-time counters.
##
StatHost "tinyproxy.stats"

##
## StatFile is the template served for StatHost requests. tinyproxy substitutes
## {opens} {reqs} {badconns} {deniedconns} {refusedconns} and the standard
## variables ({version} {package} {date} ...). Placeholders must be lowercase
## letters only, at most 32 characters (see src/html-error.c).
##
## We ship a machine readable template so the exporter never has to guess.
## Leave this commented out to fall back to tinyproxy's built-in HTML page --
## the exporter understands that format too.
##
StatFile "/etc/tinyproxy/statpage.txt"

##
## Logging
##
## A log *file* (never syslog) is required: the exporter tails this file. The
## path must match TINYPROXY_LOG_PATH in the exporter container, and the file is
## appended to across restarts (tinyproxy opens it with O_APPEND).
##
LogFile "/var/log/tinyproxy/tinyproxy.log"

##
## LogLevel: Info is the most complete level for monitoring.
## With `Connect`, tinyproxy drops every LOG_INFO message -- including
## "Closed connection between local client ..." and "Failed auth attempt ...".
## Levels, most to least verbose: Info > Connect > Notice > Warning > Error >
## Critical.
##
LogLevel Info

#
# PidFile "/run/tinyproxy/tinyproxy.pid"

##
## Access control
##
## As soon as any Allow/Deny directive is present the default action becomes
## DENY, so clients reaching the container over the Docker network must be
## whitelisted explicitly. 0.0.0.0/0 makes tinyproxy an OPEN PROXY for anybody
## who can reach port 8888 -- tighten this in production, e.g.
##   Allow 172.16.0.0/12
##   Allow 127.0.0.1
##
Allow 0.0.0.0/0

##
## Filtering (site whitelist): OFF by default.
##
## Two reasons to ship it off:
##   * a proxy image that can only reach a hard-coded list of domains is a
##     surprising default -- it is a whitelist, not a blacklist;
##   * the StatHost page is itself subject to the filter. A whitelist that
##     forgets to list the StatHost name (tinyproxy.stats) makes the container
##     health check fail in a loop and cuts the exporter's statistics channel
##     off with 403. See docs/filter.md.
##
## Uncomment the three lines below to turn it on. The rule file
## (/etc/tinyproxy/filter, i.e. tinyproxy/filter in this repository) already
## allows tinyproxy.stats for exactly that reason -- keep that line.
##
# Filter "/etc/tinyproxy/filter"
# FilterType fnmatch
# FilterDefaultDeny Yes

##
## Do not leak the container hostname through the Via header.
##
ViaProxyName "tinyproxy"
