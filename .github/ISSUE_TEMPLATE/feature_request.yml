name: 功能建议
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述当下的痛点，而不是直接给方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 例如用 Prometheus 侧 recording rule、日志对账等方式绕过
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我了解 tinyproxy 本身不统计流量字节数（见 [docs/traffic.md](../../docs/traffic.md)），相关需求需要换思路
          required: false
        - label: 我愿意提交 PR 来实现这个功能
          required: false
