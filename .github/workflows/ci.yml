# push 与 PR 的常规门禁：代码格式、vet、单元测试与部署清单校验。
# 镜像发布见 release.yml。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exporter
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: exporter/go.mod
          cache-dependency-path: exporter/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # docker compose config 只做解析与合并，不启动任何容器。
      - name: validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.dev.yml config -q

      # ServiceMonitor / PrometheusRule 属于 CRD，本地没有 schema，
      # 用 -ignore-missing-schemas 跳过它们的校验。
      - name: validate kubernetes manifest
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          /tmp/kubeconform -strict -ignore-missing-schemas -summary k8s/tinyproxy.yaml
