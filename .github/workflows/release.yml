# 打 tag 即发布：构建 tinyproxy 与 tinyproxy-exporter 两个镜像并推送到 GitHub Container Registry。
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# 两个镜像的版本互不相干，tag 的来源也就不同：
#
#   tinyproxy-exporter  跟随本仓库手动打的 git tag
#                       v0.2.0 -> :0.2.0, :0.2, :0, :latest
#   tinyproxy           跟随上游 tinyproxy 的版本（即 Alpine 仓库里的包版本）
#                       1.11.2 -> :1.11.2, :1.11, :1, :latest
#
# tinyproxy 镜像是 `apk add tinyproxy` 装出来的，它的版本由基础镜像的仓库决定，跟本
# 仓库的 tag 没有任何对应关系；用仓库 tag 去命名它只会误导用户。所以 upstream job 在
# 构建前现查上游版本，一路传给 Dockerfile：既当 tag，也当校验依据（镜像内实际装到的
# 版本与 tag 不符就让构建失败）。
#
# 无需额外配置：GHCR 用仓库内置的 GITHUB_TOKEN 登录，命名空间就是仓库 owner。
# 唯一可选的 Variable（Settings -> Secrets and variables -> Actions -> Variables）：
#   APK_MIRROR   受限网络下的 Alpine 镜像源，如 https://mirrors.aliyun.com/alpine
#
# 首次发布后到仓库的 Packages 页面把这两个包的可见性设为 Public，否则匿名拉取会失败。
name: release

on:
  push:
    tags:
      - "v*"
  # 允许在 Actions 页面手动触发。选 tag 即补发该次发布；选 main 可单独把 tinyproxy
  # 镜像同步到上游最新版本（exporter 侧此时没有可用的 semver，会跳过 exporter job）。
  workflow_dispatch:

# 推送 GHCR 需要 packages: write，其余保持最小权限。
permissions:
  contents: read
  packages: write

# 同一次触发只保留一次运行。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR 要求镜像路径全小写；仓库 owner 含大写字母时这里需要额外转换。
  NAMESPACE: ${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------------------
  # 解析上游 tinyproxy 版本。包装到哪个版本只有 Alpine 仓库知道，所以直接起一个
  # 基础镜像装一次、问它要事实，而不是在本仓库维护一份会过期的版本表。
  # ---------------------------------------------------------------------------
  upstream:
    runs-on: ubuntu-latest
    outputs:
      # 形如 1.11.2（已剥掉 Alpine 的包修订号 -r0）。
      tinyproxy: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        env:
          APK_MIRROR: ${{ vars.APK_MIRROR }}
        run: |
          set -euo pipefail

          # 基础镜像以 tinyproxy/Dockerfile 为准，避免这里和那里各写一份而漂移。
          base="$(sed -n 's/^FROM[[:space:]]\{1,\}\(alpine:[^[:space:]]*\).*/\1/p' tinyproxy/Dockerfile | head -n1)"
          if [ -z "${base}" ]; then
            echo "无法从 tinyproxy/Dockerfile 解析出 Alpine 基础镜像" >&2
            exit 1
          fi
          echo "基础镜像：${base}"

          # 单引号包住脚本，${APK_MIRROR} 由容器内的 sh 展开（通过 -e 传进去）。
          raw="$(docker run --rm -e APK_MIRROR="${APK_MIRROR}" "${base}" sh -c '
            set -eu
            if [ -n "${APK_MIRROR}" ]; then
              sed -i "s|https://dl-cdn.alpinelinux.org/alpine|${APK_MIRROR}|g" /etc/apk/repositories
            fi
            apk add --no-cache -q tinyproxy >/dev/null
            apk list --installed tinyproxy | head -n1 | cut -d" " -f1
          ')"
          version="${raw#tinyproxy-}"
          version="${version%-r*}"   # 1.11.2-r0 -> 1.11.2，-rN 是 Alpine 的打包修订号
          echo "上游 tinyproxy 版本：${version}"

          # 下面要用 semver 派生出 1.11 / 1 这样的浮动 tag，不是 semver 就当场停下，
          # 让版本格式的变化显式地暴露出来，而不是悄悄发出一堆错 tag。
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "上游版本 '${version}' 不是 semver，请检查 tinyproxy/Dockerfile 的基础镜像" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------------------
  # exporter：版本就是本仓库手动打的 tag。
  # ---------------------------------------------------------------------------
  exporter:
    # exporter 的版本来自仓库 tag，没推 tag（例如只手动 dispatch main 去刷新 tinyproxy）
    # 就没有可用的版本号，直接跳过，而不是拿分支名当版本发出去。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只需要 linux/amd64 的话，删掉 setup-qemu 这一步以及下面的 platforms 行。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.2.0 -> 0.2.0 / 0.2 / 0 / latest，并写入 OCI 标签。
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/tinyproxy-exporter
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 预发布 tag（如 v0.2.0-rc.1）不覆盖 latest。
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@v7
        with:
          context: ./exporter
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # exporter/Dockerfile 用它注入二进制的 -X main.version / -X main.revision，
          # 于是 `tinyproxy-exporter -version`、/healthz 与 / 页面报出的版本与镜像
          # tag 同源，都是这个手动打的 tag。
          build-args: |
            APK_MIRROR=${{ vars.APK_MIRROR }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=exporter
          cache-to: type=gha,mode=max,scope=exporter

  # ---------------------------------------------------------------------------
  # tinyproxy：版本就是上游版本，与本次推的是什么 tag 无关。latest 恒指向上游最新。
  # ---------------------------------------------------------------------------
  tinyproxy:
    needs: upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.11.2 -> 1.11.2 / 1.11 / 1 / latest。tag 完全由上游版本决定，所以不依赖
      # 本次 ref 是不是 semver 形态的 tag。
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/tinyproxy
          tags: |
            type=raw,value=${{ needs.upstream.outputs.tinyproxy }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.upstream.outputs.tinyproxy }}
            type=semver,pattern={{major}},value=${{ needs.upstream.outputs.tinyproxy }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.upstream.outputs.tinyproxy }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@v7
        with:
          context: ./tinyproxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # TINYPROXY_VERSION 既是上述 tag 的来源，也是 Dockerfile 的校验基准：
          # 装到的版本对不上就直接构建失败，宁可发不出去也不发出一个标错版本的镜像。
          build-args: |
            APK_MIRROR=${{ vars.APK_MIRROR }}
            TINYPROXY_VERSION=${{ needs.upstream.outputs.tinyproxy }}
          cache-from: type=gha,scope=tinyproxy
          cache-to: type=gha,mode=max,scope=tinyproxy
