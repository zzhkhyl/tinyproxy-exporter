# 打 tag 即发布：构建 tinyproxy 与 tinyproxy-exporter 两个镜像并推送到 GitHub Container Registry。
#
#   git tag v1.2.3
#   git push origin v1.2.3
#
# 无需额外配置：GHCR 用仓库内置的 GITHUB_TOKEN 登录，命名空间就是仓库 owner。
# 唯一可选的 Variable（Settings -> Secrets and variables -> Actions -> Variables）：
#   APK_MIRROR   受限网络下的 Alpine 镜像源，如 https://mirrors.aliyun.com/alpine
#
# 产物（v1.2.3 为例，owner 即仓库所属账号）：
#   ghcr.io/<owner>/tinyproxy:1.2.3, :1.2, :1, :latest
#   ghcr.io/<owner>/tinyproxy-exporter:1.2.3, :1.2, :1, :latest
#
# 首次发布后到仓库的 Packages 页面把这两个包的可见性设为 Public，否则匿名拉取会失败。
name: release

on:
  push:
    tags:
      - "v*"
  # 允许在 Actions 页面手动触发（重跑或补发）。
  workflow_dispatch:

# 推送 GHCR 需要 packages: write，其余保持最小权限。
permissions:
  contents: read
  packages: write

# 同一 tag 只保留一次运行。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR 要求镜像路径全小写；仓库 owner 含大写字母时这里需要额外转换。
  NAMESPACE: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tinyproxy
            context: ./tinyproxy
          - image: tinyproxy-exporter
            context: ./exporter
    steps:
      - uses: actions/checkout@v4

      # 只需要 linux/amd64 的话，删掉 setup-qemu 这一步以及下面的 platforms 行。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 -> 1.2.3 / 1.2 / 1 / latest，并写入 OCI 标签。
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 预发布 tag（如 v1.2.3-rc.1）不覆盖 latest。
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # tinyproxy/Dockerfile 只声明了 APK_MIRROR，多传的 VERSION/REVISION
          # 会被忽略（仅产生 unused build-arg 警告）；exporter 则用它注入
          # 二进制的 -X main.version / -X main.revision。
          build-args: |
            APK_MIRROR=${{ vars.APK_MIRROR }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
